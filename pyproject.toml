[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-scene-reasoner"
version = "0.1.0"
description = "DriveLM-compatible driving scene understanding and reasoning research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["pillow>=10", "torch>=2.4", "transformers>=4.57", "accelerate>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2"]

[project.scripts]
drivescene = "drivescene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
